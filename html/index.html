<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 16px; }

  #controls { margin-bottom: 14px; }
  #controls button {
    padding: 7px 16px; font-size: 14px; margin-right: 8px; cursor: pointer;
  }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #row-label { font-size: 14px; color: #555; }

  #main-layout {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    align-items: flex-start;
  }

  #container { position: relative; flex-shrink: 0; }

  #status-panel { min-width: 220px; }
  #status-table { border-collapse: collapse; font-size: 15px; margin-bottom: 14px; }
  #status-table td { padding: 5px 18px 5px 0; vertical-align: baseline; }
  #status-table td:first-child { color: #888; white-space: nowrap; }
  #status-table td:last-child { font-variant-numeric: tabular-nums; }
  #s-best { font-size: 22px; font-weight: bold; }

  #url-line { font-size: 13px; margin-bottom: 10px; }
  #results  { font-size: 12px; color: #555; max-height: 100px; overflow-y: auto; }

  #puzzle-links { margin-top: 14px; font-size: 13px; color: #888; }
  #puzzle-links a { margin-right: 10px; }
</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<div id="controls">
  <button id="btn-start" onclick="startWorker()">Start</button>
  <button id="btn-stop"  onclick="stopWorker()" disabled>Stop</button>
  <button id="btn-new"   onclick="newRow()">New Row</button>
  <span id="row-label">Row: <b id="rownum">—</b></span>
</div>

<div id="main-layout">
  <div id="container"><div id="tray"></div></div>

  <div id="status-panel">
    <table id="status-table">
      <tr><td>Best</td>     <td><span id="s-best">—</span></td></tr>
      <tr><td>Best at</td>  <td id="s-best-node">—</td></tr>
      <tr><td>Nodes</td>    <td id="s-nodes">—</td></tr>
      <tr><td>Time</td>     <td id="s-time">—</td></tr>
      <tr><td>Rate</td>     <td id="s-rate">—</td></tr>
      <tr><td>Restarts</td> <td id="s-restarts">—</td></tr>
    </table>
    <div id="url-line"></div>
    <div id="results"></div>
  </div>
</div>

<div id="puzzle-links">
  Try: <a href="?puz=b9x9s1">9x9</a>
       <a href="?puz=b10x10s1">10x10</a>
       <a href="?puz=eternity2">eternity2</a>
</div>

<script>
var w;
var saveUsed = false;
var puz, pieces, width, height, best = 0;

// ── cookie helpers ────────────────────────────────────────────────────────────
function getCookie(name) {
    var v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
    return v ? decodeURIComponent(v[2]) : null;
}
function setCookie(name, value, days) {
    document.cookie = name + '=' + encodeURIComponent(value) +
        '; max-age=' + (days * 86400) + '; path=/; SameSite=Lax';
}
function deleteCookie(name) {
    document.cookie = name + '=; max-age=0; path=/';
}

// ── formatting ────────────────────────────────────────────────────────────────
function fmtNum(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return '' + n;
}
function fmtTime(s) {
    s = +s;
    if (s < 60)   return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}

function parseStatus(s) {
    var m;
    m = s.match(/best=(\d+)/);     if (m) document.getElementById('s-best').textContent = m[1];
    m = s.match(/\((\w+)\)/);      if (m) document.getElementById('s-best-node').textContent = 'node ' + m[1];
    m = s.match(/nodes=(\d+)/);    if (m) document.getElementById('s-nodes').textContent = fmtNum(+m[1]);
    m = s.match(/time=(\d+)/);     if (m) document.getElementById('s-time').textContent = fmtTime(+m[1]);
    m = s.match(/rate=(\d+)/);     if (m) document.getElementById('s-rate').textContent = fmtNum(+m[1]) + '/s';
    m = s.match(/restarts=(\d+)/); if (m) document.getElementById('s-restarts').textContent = m[1];
}

// ── puzzle image ──────────────────────────────────────────────────────────────
function printSol(p) {
    var n = p.length;
    var url = '<a href="https://e2.bucas.name/#puzzle=EternityII' +
              '&board_w=' + width + '&board_h=' + height + '&board_edges=';
    for (var row = 0; row < height; row++) {
        for (var col = 0; col < width; col++) {
            var idx = row * width + col;
            for (var rot = 0; rot < 4; rot++) {
                if (idx < n && p[idx][0] > 0) {
                    var v = pieces[p[idx][0] - 1][(4 + rot - p[idx][1]) % 4];
                    $("#n" + idx + "-" + rot).attr("src", "img/" + v + "-" + rot + ".png");
                    url += "animovhuqprslwtjgkbdecf"[v];
                } else {
                    $("#n" + idx + "-" + rot).attr("src", (rot % 2) === 0 ? 'img/blankh.gif' : 'img/blankv.gif');
                    url += 'a';
                }
            }
        }
    }
    url += '&board_pieces=';
    for (var row = 0; row < height; row++) {
        for (var col = 0; col < width; col++) {
            var idx = row * width + col;
            if (idx < n && p[idx][0] > 0) url += ("00" + p[idx][0]).slice(-3);
        }
    }
    url += '" target="_blank">view on bucas.name</a>';
    document.getElementById('url-line').innerHTML = url;
}

// ── save/restore helpers ──────────────────────────────────────────────────────
function saveDataToText(d) {
    var s = 'ord=' + d.ord + '\nrownum=' + d.rownum + '\nnodes=' + d.nodes +
        '\nbest=' + d.best + '\nbest_node=' + d.best_node +
        '\nrestarts=' + d.restarts + '\nbestbest=' + d.bestbest +
        '\nsolutions=' + d.solutions + '\nelapsed=' + d.elapsed + '\n';
    for (var i = 0; i < d.pieces.length; i++)
        s += d.pieces[i][0] + ' ' + d.pieces[i][1] + '\n';
    return s;
}

// ── worker control ────────────────────────────────────────────────────────────
function puzname() {
    if (puz === 'b9x9s1')    return '9x9-row-7-259478-wasm';
    if (puz === 'b10x10s1')  return '10x10-row-10-19864204-wasm';
    if (puz === 'eternity2') return 'eternity2-row-7-6003355-wasm';
    return null;
}

function startWorker() {
    if (typeof w !== 'undefined') stopWorker();
    var name = puzname();
    if (!name) { alert('unknown puzzle: ' + puz); return; }

    w = new Worker(name + '.js');
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled  = false;
    document.getElementById('btn-new').disabled   = false;

    w.onmessage = function(e) {
        // First message signals worker is ready — fetch a row and kick off.
        w.onmessage = handleMessage;
        sendRow();
    };
}

function handleMessage(e) {
    if (e.data.msgType === 'status') {
        parseStatus(e.data.data);
        var words = e.data.data.split(' ');
        if (words[words.length - 1] === 'last=1') {
            var rowDisplay = document.getElementById('rownum').textContent;
            document.getElementById('results').innerHTML +=
                '<br>row=' + rowDisplay + ' ' + e.data.data;
            saveUsed = true;   // don't restore save on auto-restart
            sendRow();
        }
    } else if (e.data.msgType === 'best') {
        var score = e.data.data[0];
        if (score > best) {
            best = score;
            document.getElementById('s-best').textContent = score;
            printSol(e.data.data[1]);
            setCookie('e2best_' + puz, JSON.stringify({score: score, pieces: e.data.data[1]}), 30);
        }
    } else if (e.data.msgType === 'save') {
        setCookie('e2save_' + puz, JSON.stringify(e.data.data), 30);
    } else if (e.data.msgType === 'exit') {
        sendRow();
    }
}

function sendRow() {
    var num;
    $.ajax({
        url: 'req-' + puz + '.cgi',
        async: false,
        success: function(d) { num = d.rownum; },
        error:   function()  { alert('ajax error fetching row'); }
    });
    document.getElementById('rownum').textContent = num;

    var msg = num + '';
    if (!saveUsed) {
        saveUsed = true;
        var savedJson = getCookie('e2save_' + puz);
        if (savedJson) {
            try {
                var savedData = JSON.parse(savedJson);
                msg = {rownum: num, saveText: saveDataToText(savedData)};
                console.log('restoring save from cookie (row ' + savedData.rownum + ')');
            } catch (err) {
                console.log('bad save cookie, ignoring: ' + err);
            }
        }
    }
    w.postMessage(msg);
}

function stopWorker() {
    if (typeof w !== 'undefined') { w.terminate(); w = undefined; }
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').disabled  = true;
}

function newRow() {
    deleteCookie('e2save_' + puz);
    saveUsed = true;   // don't try to restore from (now-deleted) cookie
    stopWorker();
    startWorker();
}

// ── page init ─────────────────────────────────────────────────────────────────
$(document).ready(function() {
    var urlParams = new URLSearchParams(window.location.search);
    puz = urlParams.get('puz') || 'b10x10s1';

    $.ajax({
        url: 'json/' + puz + '.json',
        async: false,
        success: function(d) { pieces = d.pieces; width = d.width; height = d.height; },
        error:   function()  { alert('ajax error loading puzzle data'); }
    });

    // build image tray
    var tab = '', top = 0;
    for (var row = 0; row < height; row++) {
        var left = 0;
        for (var col = 0; col < width; col++) {
            for (var rot = 0; rot < 4; rot++) {
                tab += '<img id="n' + (row*width+col) + '-' + rot +
                    '" style="position:absolute;left:' + (left + (rot===1)*16) +
                    'px;top:' + (top + (rot===2)*16) + 'px;width:' +
                    (1+((rot%2)===0))*16 + 'px;height:' + (1+((rot%2)===1))*16 +
                    'px;" src="img/' + pieces[row*width+col][(rot+2)%4] + '-' + rot + '.png"/>\n';
            }
            left += 33;
        }
        top += 33;
    }
    $('#container').height(height * 32);
    $('#tray').html(tab);

    // restore best solution image from cookie
    var bestJson = getCookie('e2best_' + puz);
    if (bestJson) {
        try {
            var bd = JSON.parse(bestJson);
            best = bd.score;
            document.getElementById('s-best').textContent = bd.score;
            printSol(bd.pieces);
        } catch (err) {
            console.log('bad best cookie: ' + err);
        }
    }
});
</script>

</body>
</html>
